services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the launching process}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the launching process}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./var/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the launching process}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the launching process}
      STORAGE_WORKER_ACCESS_KEY_ID: ${STORAGE_WORKER_ACCESS_KEY_ID:?set STORAGE_WORKER_ACCESS_KEY_ID in the launching process}
      STORAGE_WORKER_SECRET_ACCESS_KEY: ${STORAGE_WORKER_SECRET_ACCESS_KEY:?set STORAGE_WORKER_SECRET_ACCESS_KEY in the launching process}
      STORAGE_API_ACCESS_KEY_ID: ${STORAGE_API_ACCESS_KEY_ID:?set STORAGE_API_ACCESS_KEY_ID in the launching process}
      STORAGE_API_SECRET_ACCESS_KEY: ${STORAGE_API_SECRET_ACCESS_KEY:?set STORAGE_API_SECRET_ACCESS_KEY in the launching process}
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
      - ./deploy/minio/worker-policy.json:/policies/worker.json:ro
      - ./deploy/minio/api-policy.json:/policies/api.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
