name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate:openapi
      - run: pnpm secret-scan
      - run: pnpm migrate:clean
        env:
          DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm test:db
        env:
          DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm --filter @job-to-invoice/portal build
      - run: pnpm --filter @job-to-invoice/admin build
      - run: pnpm --filter @job-to-invoice/api build
      - run: pnpm --filter @job-to-invoice/worker build
